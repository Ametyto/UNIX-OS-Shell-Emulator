<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.ico" sizes="any">
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <div id="terminal">
        <div id="output">
            <div class="line system">UNIX OS Shell Emulator [v1.0]</div>
            <div class="line system">Type "help" to see available commands.</div>
            <div class="line system">------------------------------------</div>
        </div>
        <div id="input">
            <div id="prompt">user@shell:~$</div>
            <input type="text" id="cmd-input" autofocus autocomplete="off">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
